# cargo-audit configuration — advisory exceptions with justification.
[advisories]
ignore = [
    # quick-xml 0.30 (via zbus_xml — Linux accessibility stack) and 0.39
    # (via wayland-scanner proc-macro). DoS-class advisories; the fix
    # (>=0.41) is unreachable while eframe/egui 0.31 dependency trees pin
    # lower ranges. Both instances only parse trusted local desktop data
    # (D-Bus introspection, Wayland protocol XML at build time) — no
    # untrusted XML reaches these paths. Re-evaluate on egui upgrade.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # paste v1.0.15: unmaintained — transitive via accesskit_windows -> egui-winit
    # -> eframe 0.31. proc-macro only, no runtime risk. Re-evaluate on egui upgrade.
    "RUSTSEC-2024-0436",

    # ttf-parser v0.25.1: unmaintained — transitive via accesskit -> eframe 0.31.
    # Re-evaluate on egui upgrade.
    "RUSTSEC-2026-0192",
]
