[package]
name = "robot_control_rust"
version = "0.1.9"
edition = "2021"
description = "Robot Control System - Pure Rust Implementation"
license = "GPL-3.0-only"

[lib]
name = "robot_control_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# GUI framework
eframe = { workspace = true }
egui = { workspace = true }
egui_plot = "0.31"

# Serial communication
serialport = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Time handling
chrono = { workspace = true }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# Error handling
anyhow = "1"

# HTTP client for LLM API
ureq = { version = "3", features = ["json"] }

# MCP SDK
rmcp = { version = "1.6.0", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
schemars = "1.0"

# High Performance & Intelligence

[dev-dependencies]
mockall = "0.14.0"








