[package]
name = "robot_control_rust"
version.workspace = true
edition = "2021"
description = "Robot Control System — High-performance desktop workspace"
license = "GPL-3.0-only"
rust-version.workspace = true

[lib]
name = "robot_control_core"
crate-type = ["cdylib", "rlib"]

# The GUI workspace binary genuinely needs all runtime services; the library
# target stays buildable under any feature combination for downstream tools.
[[bin]]
name = "robot_control_rust"
path = "src/main.rs"
required-features = ["hardware", "llm", "mcp"]

[[bin]]
name = "robot_control_mcp"
path = "src/bin/robot_control_mcp.rs"
required-features = ["mcp"]

[features]
default = ["hardware", "llm", "mcp"]
hardware = ["dep:serialport"]
llm = ["dep:ureq"]
mcp = ["dep:rmcp", "dep:tokio", "dep:schemars"]

[dependencies]
# ── GUI ──
eframe = { workspace = true }
egui = { workspace = true }
egui_plot = { workspace = true }

# ── Serial (feature-gated) ──
serialport = { workspace = true, optional = true }

# ── Serialization ──
serde = { workspace = true }
serde_json = { workspace = true }

# ── Time ──
chrono = { workspace = true }

# ── Error handling ──
anyhow = { workspace = true }
thiserror = { workspace = true }

# ── Logging ──
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# ── LLM API (feature-gated) ──
ureq = { version = "3", features = ["json"], optional = true }

# ── MCP SDK (feature-gated) ──
rmcp = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
mockall = "0.14.0"
