[package]
name = "rust_tools_suite"
version = "0.2.0"
edition = "2021"
description = "Rust Tools Suite with responsive desktop workflow"
license = "GPL-3.0-only"

[dependencies]
eframe = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
regex = "1"
crc32fast = "1"
sha2 = "0.10"
chrono = { workspace = true }
urlencoding = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

# GUI / TUI / Intelligent Interactive Additions
inquire = "0.9.4"
indicatif = "0.18.4"
colored = "3.1.1"
clap = { version = "4.5", features = ["derive"] }
serialport = { workspace = true }
rfd = "0.17.2"
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }
# Enables jsonwebtoken's aws-lc provider on Windows GNU without requiring a system NASM install.
aws-lc-rs = { version = "1.16.3", features = ["prebuilt-nasm"] }
