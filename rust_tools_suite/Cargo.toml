[package]
name = "rust_tools_suite"
version.workspace = true
edition.workspace = true
description = "Rust Tools Suite — Developer utilities with desktop GUI & CLI modes"
license.workspace = true
rust-version.workspace = true

[features]
# `jwt` stays in the default set so the shipped GUI keeps the JWT Inspector.
# Lean build without the heavy aws-lc-rs stack:
#   cargo build --no-default-features --features gui
default = ["gui", "jwt"]
gui = ["dep:eframe", "dep:egui", "dep:rfd", "dep:serialport"]
cli = ["dep:clap", "dep:inquire", "dep:indicatif", "dep:colored", "dep:serialport"]
full = ["gui", "cli", "jwt"]
jwt = ["dep:jsonwebtoken", "dep:aws-lc-rs"]

[dependencies]
# ── Core (always included) ──
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
crc32fast = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
urlencoding = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }

# ── GUI (feature-gated) ──
eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }
serialport = { workspace = true, optional = true }

# ── CLI (feature-gated) ──
clap = { workspace = true, optional = true }
inquire = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }
colored = { workspace = true, optional = true }

# ── JWT (feature-gated, heavy) ──
jsonwebtoken = { workspace = true, optional = true }
aws-lc-rs = { workspace = true, optional = true }

[lints]
workspace = true
