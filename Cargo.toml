[workspace]
resolver = "2"
members = [
    "robot_control_rust",
    "rust_tools_suite",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Robot Control Team"]
license = "GPL-3.0-only"
rust-version = "1.87"

[workspace.dependencies]
# ── GUI framework (shared) ──
eframe = { version = "0.31", features = ["default"] }
egui = "0.31"
egui_plot = "0.31"

# ── Serial communication ──
serialport = "4.8"

# ── Serialization (shared) ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Time handling ──
chrono = { version = "0.4", features = ["serde"] }

# ── Error handling (shared) ──
anyhow = "1"
thiserror = "2"

# ── Logging (shared) ──
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# ── Async runtime (shared) ──
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }

# ── MCP SDK (shared) ──
rmcp = { version = "1.6.0", features = ["server", "macros", "transport-io"] }
schemars = "1.0"

[profile.dev]
opt-level = 1
debug = 0
strip = true
codegen-units = 16
incremental = false
panic = "abort"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
debug = 0
incremental = false

[profile.test]
opt-level = 1
debug = 0
strip = true
incremental = false

[workspace.metadata.release]
TagPrefix = "v"
TagSuffix = ""
