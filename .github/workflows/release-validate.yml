# ─────────────────────────────────────────────────────────────
# Release Validate — Reusable quality gate for release workflow
#
# Called by release.yml to verify tag format, branch ancestry,
# and run the full quality gate (fmt + clippy + test + doc).
# ─────────────────────────────────────────────────────────────

name: Release Validate

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Tag name to validate (e.g., v1.0.0)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-validate-${{ inputs.tag_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-tag:
    name: Verify Tag Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - name: Validate tag format and branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid tag format: $TAG"
            exit 1
          fi

          git fetch origin develop:refs/remotes/origin/develop --quiet || true

          if ! git show-ref --verify --quiet refs/remotes/origin/develop; then
            echo "::error::origin/develop does not exist; cannot verify tag ancestry"
            exit 1
          fi

          if git merge-base --is-ancestor HEAD origin/develop; then
            echo "::notice::Tag commit is reachable from origin/develop"
          else
            echo "::error::Tag commit must be reachable from origin/develop"
            exit 1
          fi

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify-tag
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libgtk-3-dev

      - uses: Swatinem/rust-cache@v2

      - name: Run quality gate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
