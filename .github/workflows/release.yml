name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to publish, for example v0.1.9
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  call-validate:
    uses: ./.github/workflows/release-validate.yml
    with:
      tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: call-validate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/go/rusktask/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Install mdBook
        shell: pwsh
        run: |
          if (-not (Get-Command mdbook -ErrorAction SilentlyContinue)) {
            cargo install mdbook --version 0.5.2 --locked
          }
      - name: Build binaries
        shell: pwsh
        run: cargo build --release --workspace
      - name: Package Windows installer
        shell: pwsh
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          $version = "$env:VERSION" -replace '^v', ''
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$') {
            Write-Error "Invalid version format: $version"
            exit 1
          }
          Push-Location scripts/go/rusktask
          go run . package-windows-installer --version $version --skip-build
          Pop-Location
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release_artifacts/windows-x64/installer/robot_control_suite_*_windows_x64-setup.exe
          if-no-files-found: error
      - name: Package Windows portable ZIP
        shell: pwsh
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          $version = "$env:VERSION" -replace '^v', ''
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$') {
            Write-Error "Invalid version format: $version"
            exit 1
          }
          Push-Location scripts/go/rusktask
          go run . package-windows-assets --version $version --output-dir release_artifacts --skip-build
          Pop-Location
      - name: Upload Windows portable
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: release_artifacts/robot_control_suite_*_windows_x64_portable.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: call-validate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libgtk-3-dev
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build binaries
        run: cargo build --release --workspace
      - name: Create Debian package
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid version format: $version"
            exit 1
          fi

          pkg_dir="dist/debian"
          mkdir -p "$pkg_dir/usr/local/bin"
          mkdir -p "$pkg_dir/usr/local/share/applications"

          cp target/release/robot_control_rust "$pkg_dir/usr/local/bin/"
          cp target/release/rust_tools_suite "$pkg_dir/usr/local/bin/"

          mkdir -p "$pkg_dir/DEBIAN"
          printf '%s\n' \
            "Package: robot-control-suite" \
            "Version: ${version}" \
            "Section: utils" \
            "Priority: optional" \
            "Architecture: amd64" \
            "Maintainer: loopgap <noreply@github.com>" \
            "Description: Robot Control and Tools Suite" \
            > "$pkg_dir/DEBIAN/control"

          dpkg-deb --build "$pkg_dir" "dist/robot_control_suite_${version}_amd64.deb"
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/*_amd64.deb
          if-no-files-found: error

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/go/rusktask/go.mod
      - name: Validate release notes policy
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="release_notes/RELEASE_NOTES_${RELEASE_TAG}.md"
          test -f "$notes_file"
          test -s "$notes_file"
          ./scripts/ubuntu/task.sh release-notes-validate RELEASE_NOTES_FILE="$notes_file" RELEASE_NOTES_MODE="release"
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: artifacts
      - name: Validate artifacts and create checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          installer="artifacts/robot_control_suite_${version}_windows_x64-setup.exe"
          portable="artifacts/robot_control_suite_${version}_windows_x64_portable.zip"
          deb="artifacts/robot_control_suite_${version}_amd64.deb"
          for artifact in "$installer" "$portable" "$deb"; do
            if [ ! -s "$artifact" ]; then
              echo "::error::Missing or empty release artifact: $artifact"
              find artifacts -maxdepth 1 -type f -print
              exit 1
            fi
          done
          cd artifacts
          sha256sum \
            "robot_control_suite_${version}_windows_x64-setup.exe" \
            "robot_control_suite_${version}_windows_x64_portable.zip" \
            "robot_control_suite_${version}_amd64.deb" \
            > checksums-sha256.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name, '-') }}
          body_path: release_notes/RELEASE_NOTES_${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            artifacts/*.exe
            artifacts/*.deb
            artifacts/*_portable.zip
            artifacts/checksums-sha256.txt

  publish-draft-on-failure:
    name: Publish Draft Release On Failure
    if: ${{ always() && failure() }}
    runs-on: ubuntu-latest
    needs:
      - call-validate
      - build-windows
      - build-linux
      - publish-release
    steps:
      - name: Create failure summary
        run: |
          cat > failure-summary.md << 'EOF'
          Automatic draft release generated because release workflow did not fully succeed.

          Job results:
          - call-validate: ${{ needs.call-validate.result }}
          - build-windows: ${{ needs.build-windows.result }}
          - build-linux: ${{ needs.build-linux.result }}
          - publish-release: ${{ needs.publish-release.result }}

          Next actions:
          1. Inspect the failed job logs.
          2. Fix the issue and re-run release workflow.
          3. Use rollback script if the tag should be revoked.
          EOF
      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name, '-') }}
          body_path: failure-summary.md
