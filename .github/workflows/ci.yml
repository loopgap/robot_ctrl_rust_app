# ─────────────────────────────────────────────────────────────
# CI — Continuous Integration Pipeline
#
# Runs on every push/PR to main and develop branches.
# Jobs are ordered as a DAG to minimize redundant work:
#
#   workspace-governance ──┬── fmt
#                          ├── clippy   (matrix: 3 OS)
#                          ├── test     (matrix: 3 OS)
#                          ├── doc
#                          └── release-workflow-smoke-test
#
# Design principles:
#   - Least-privilege permissions per job
#   - Fail-fast disabled for cross-platform matrix to maximize coverage
#   - Explicit timeouts prevent hung jobs from blocking the pipeline
#   - Swatinem/rust-cache@v2 for deterministic dependency caching
# ─────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Gate: workspace structure & file-residue audit ───────
  workspace-governance:
    name: Workspace Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/go/rusktask/go.mod

      - name: Process file residue audit
        shell: bash
        run: |
          set -euo pipefail
          cd scripts/go/rusktask
          go run . workspace-cleanup --mode audit --strict

      - name: Workspace structure guard
        shell: bash
        run: |
          set -euo pipefail
          cd scripts/go/rusktask
          go run . workspace-guard --mode audit --strict

  # ── Formatting ───────────────────────────────────────────
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: workspace-governance
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check

  # ── Linting (cross-platform matrix) ─────────────────────
  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: workspace-governance
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libgtk-3-dev

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets -- -D warnings

  # ── Feature-combination matrix ──────────────────────────
  # Every declared feature combination must at least type-check;
  # the library target must build under any subset of features.
  feature-matrix:
    name: Feature matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: workspace-governance
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libgtk-3-dev

      - uses: Swatinem/rust-cache@v2

      - name: Check feature combinations
        shell: bash
        run: |
          set -euo pipefail
          # robot_control_rust: library must compile under any feature subset
          for features in "" "hardware" "llm" "mcp" "hardware,llm" "hardware,mcp"; do
            echo "::group::robot_control_rust [${features:-none}]"
            cargo check -p robot_control_rust --no-default-features ${features:+--features "$features"}
            echo "::endgroup::"
          done
          # rust_tools_suite: every interface combination must compile
          for features in "gui" "cli" "gui,cli" "gui,jwt" "full"; do
            echo "::group::rust_tools_suite [$features]"
            cargo check -p rust_tools_suite --no-default-features --features "$features"
            echo "::endgroup::"
          done

  # ── Tests (cross-platform matrix) ───────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: workspace-governance
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libgtk-3-dev

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace

  # ── Documentation build ─────────────────────────────────
  doc:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: workspace-governance
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libgtk-3-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build docs
        shell: bash
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          cargo doc --workspace --no-deps

  # ── Release infrastructure smoke test ───────────────────
  release-workflow-smoke-test:
    name: Release Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: workspace-governance
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify release-related files exist
        shell: bash
        run: |
          set -euo pipefail

          # 1. Cargo.toml workspace integrity
          if [ ! -f "Cargo.toml" ]; then
            echo "::error::Cargo.toml not found"
            exit 1
          fi
          if ! grep -q 'robot_control_rust' Cargo.toml || ! grep -q 'rust_tools_suite' Cargo.toml; then
            echo "::error::Cargo.toml missing workspace members (robot_control_rust, rust_tools_suite)"
            exit 1
          fi
          echo "[OK] Cargo.toml workspace members verified"

          # 2. NSIS installer script (canonical location)
          if [ ! -f "scripts/nsis/installer.nsi" ]; then
            echo "::error::scripts/nsis/installer.nsi not found"
            exit 1
          fi
          echo "[OK] scripts/nsis/installer.nsi exists"

          # 3. Release notes directory
          if [ ! -d "release_notes" ]; then
            echo "::error::release_notes/ directory not found"
            exit 1
          fi
          RELEASE_NOTES_COUNT=$(find release_notes -maxdepth 1 -name 'RELEASE_NOTES_*.md' -type f | wc -l)
          if [ "$RELEASE_NOTES_COUNT" -eq 0 ]; then
            echo "::error::No RELEASE_NOTES_*.md files found in release_notes/"
            exit 1
          fi
          echo "[OK] release_notes/ contains ${RELEASE_NOTES_COUNT} release note(s)"

          echo ""
          echo "[PASS] All release infrastructure files verified"
