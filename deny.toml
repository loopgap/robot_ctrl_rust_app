[graph]
targets = []

[advisories]
# cargo-deny >= 0.19 expects unmaintained scope values.
unmaintained = "workspace"
yanked = "deny"
ignore = [
  # quick-xml 0.30 (zbus_xml, Linux a11y stack) and 0.39 (wayland-scanner
  # proc-macro): DoS-class advisories, fix requires >=0.41 which the upstream
  # egui 0.31 dependency trees pin below. Both parse trusted local desktop
  # data (D-Bus introspection / Wayland protocol XML at build time) — no
  # untrusted XML reaches these code paths. Re-evaluate on egui upgrade.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-only",
  "ISC",
  "MIT",
  "MPL-2.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
